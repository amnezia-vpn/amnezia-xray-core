name: Build Docker Image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  release:
    types:
      - published
      - released
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag:"
        required: true
      latest:
        description: "Set to latest"
        type: boolean
        default: false

env:
  FULL_IMAGE_NAME: amneziavpn/amnezia-xray-core

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve Docker image metadata
        run: |
          PUSH_IMAGE=true
          SOURCE_TAG="${{ github.event.inputs.tag }}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SOURCE_TAG="pr-${{ github.event.pull_request.number }}"
            PUSH_IMAGE=false
          elif [[ -z "$SOURCE_TAG" && -n "${{ github.event.release.tag_name }}" ]]; then
            SOURCE_TAG="${{ github.event.release.tag_name }}"
          elif [[ -z "$SOURCE_TAG" ]]; then
            SOURCE_TAG="${{ github.ref_name }}"
          fi

          if [[ -z "$SOURCE_TAG" ]]; then
            echo "Error: Could not determine a valid tag source."
            exit 1
          fi

          if [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+ ]]; then
            IMAGE_TAG="${SOURCE_TAG#v}"
          else
            IMAGE_TAG="$SOURCE_TAG"
          fi

          LATEST=false
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.prerelease }}" == "false" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.latest }}" == "true" ]]; then
            LATEST=true
          fi

          echo "Docker image: '${{ env.FULL_IMAGE_NAME }}'."
          echo "Docker image tag: '$IMAGE_TAG'."
          echo "Push image: '$PUSH_IMAGE'."
          echo "Latest: '$LATEST'."
          echo "IMAGE_TAG=$IMAGE_TAG" >>${GITHUB_ENV}
          echo "PUSH_IMAGE=$PUSH_IMAGE" >>${GITHUB_ENV}
          echo "LATEST=$LATEST" >>${GITHUB_ENV}

          NEWEST=false
          if [[ "${{ github.event_name }}" == "release" ]]; then
            NEWEST=true
          fi

          echo "Newest: '$NEWEST'."
          echo "NEWEST=$NEWEST" >>${GITHUB_ENV}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (main architectures)
        if: env.PUSH_IMAGE == 'true'
        id: build_main_arches
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: .github/docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64/v8
            linux/ppc64le
            linux/s390x
          provenance: false
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Check Docker image (main architectures)
        if: env.PUSH_IMAGE != 'true'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: .github/docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64/v8
            linux/ppc64le
            linux/s390x
          provenance: false
          push: false

      - name: Build Docker image (additional architectures)
        if: env.PUSH_IMAGE == 'true'
        id: build_additional_arches
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: .github/docker/Dockerfile.usa
          platforms: |
            linux/386
            linux/arm/v6
            linux/riscv64
            linux/loong64
          provenance: false
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Check Docker image (additional architectures)
        if: env.PUSH_IMAGE != 'true'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: .github/docker/Dockerfile.usa
          platforms: |
            linux/386
            linux/arm/v6
            linux/riscv64
            linux/loong64
          provenance: false
          push: false

      - name: Create manifest list and push
        if: env.PUSH_IMAGE == 'true'
        run: |
          echo "Creating multi-arch manifest with tag: '${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}'."
          docker buildx imagetools create \
            --tag ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.FULL_IMAGE_NAME }}@${{ steps.build_main_arches.outputs.digest }} \
            ${{ env.FULL_IMAGE_NAME }}@${{ steps.build_additional_arches.outputs.digest }}

          if [[ "${{ env.LATEST }}" == "true" ]]; then
            echo "Adding 'latest' tag to manifest: '${{ env.FULL_IMAGE_NAME }}:latest'."
            docker buildx imagetools create \
              --tag ${{ env.FULL_IMAGE_NAME }}:latest \
              ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          fi

          if [[ "${{ env.NEWEST }}" == "true" ]]; then
            echo "Adding 'pre-release' tag to manifest: '${{ env.FULL_IMAGE_NAME }}:pre-release'."
            docker buildx imagetools create \
            --tag ${{ env.FULL_IMAGE_NAME }}:pre-release \
            ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          fi

      - name: Inspect image
        if: env.PUSH_IMAGE == 'true'
        run: |
          docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          if [[ "${{ env.LATEST }}" == "true" ]]; then
            docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:latest
          fi

          if [[ "${{ env.NEWEST }}" == "true" ]]; then
            docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:pre-release
          fi
